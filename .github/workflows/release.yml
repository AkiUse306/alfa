name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
      - name: Install CMake
        run: choco install cmake --confirm
      - name: Package release
        shell: bash
        run: |
          chmod +x ./publish.sh
          ./publish.sh
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfa-release
          path: alfa-release.tar.gz
